[project]
name = "shamansim"
version = "0.1.0"
description = "Monte Carlo DpS simulator for the WoW Forever Shaman."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "plotly>=5.24",
]

[project.scripts]
shamansim = "shamansim.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shamansim"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "configs", "tests"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
